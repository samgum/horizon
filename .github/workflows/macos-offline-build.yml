name: macos-offline-build
# Standalone macOS build & packaging workflow for Apple Silicon (arm64), Intel (x86_64), and Universal Horizon.app:
# - Supports offline play out of the box + 1-click / drag-and-drop import of horizon-26.3-resources.zip
# - Runs entirely on standard GitHub-hosted macOS runners (no self-hosted runner required)
on:
  push:
    branches: [macos-offline]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a date-tagged GitHub Release with DMG and ZIP assets
        type: boolean
        default: true
      release_tag:
        description: Optional custom release tag (defaults to macos-YYYY.MM.DD)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: macos-offline-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HORIZON_TELEMETRY_URL: "off"

jobs:
  build-macos:
    name: Build & Package macOS (arm64 + Intel x64 + Universal)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Install Rust toolchain & macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-offline-dual-arch
          save-if: true

      - name: Compute build version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          date_str=$(date -u +%Y.%m.%d)
          short_sha=$(git rev-parse --short=7 HEAD)
          tag="${{ inputs.release_tag }}"
          if [[ -z "$tag" ]]; then
            tag="macos-${date_str}"
          fi
          version="26.3-${date_str}-${short_sha}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run unit tests (guest-stack, resource-zip, dual-mode MSA auth)
        shell: bash
        run: |
          cargo test --locked -p horizon-guest-stack
          cargo test --locked -p horizon-mod-package --lib selection
          cargo test --locked -p horizon-client-render --lib auth::msa::tests
          cargo test --locked -p horizon-client-lib --lib resource_zip::tests
          cargo test --locked -p horizon-client-lib --lib no_resources::tests

      - name: Build Apple Silicon (aarch64-apple-darwin)
        env:
          HORIZON_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p horizon-official --bin horizon-official
          cp -f target/aarch64-apple-darwin/release/horizon-official target/aarch64-apple-darwin/release/horizon-client

      - name: Build Intel (x86_64-apple-darwin)
        env:
          HORIZON_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          cargo build --release --locked --target x86_64-apple-darwin -p horizon-official --bin horizon-official
          cp -f target/x86_64-apple-darwin/release/horizon-official target/x86_64-apple-darwin/release/horizon-client

      - name: Verify Rosetta 2 Intel startup & package DMG/ZIP bundles
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/macos/package_game_app.sh
          # Ensure Rosetta 2 is available on the runner to verify x86_64 binary startup
          if ! /usr/bin/pgrep oahd >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi
          target/aarch64-apple-darwin/release/horizon-client --help | grep -q -- '--resources'
          arch -x86_64 target/x86_64-apple-darwin/release/horizon-client --help | grep -q -- '--resources'

          mkdir -p dist
          packaging/macos/package_game_app.sh \
            target/aarch64-apple-darwin/release/horizon-client \
            "${{ steps.meta.outputs.version }}" dist arm64
          packaging/macos/package_game_app.sh \
            target/x86_64-apple-darwin/release/horizon-client \
            "${{ steps.meta.outputs.version }}" dist x64
          packaging/macos/package_game_app.sh \
            target/aarch64-apple-darwin/release/horizon-client \
            "${{ steps.meta.outputs.version }}" dist universal \
            target/x86_64-apple-darwin/release/horizon-client

          (cd dist && shasum -a 256 horizon-macos-*.dmg horizon-macos-*-app.zip > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload macOS DMG & ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-macos-offline-${{ steps.meta.outputs.version }}
          path: |
            dist/horizon-macos-arm64.dmg
            dist/horizon-macos-x64.dmg
            dist/horizon-macos-universal.dmg
            dist/horizon-macos-arm64-app.zip
            dist/horizon-macos-x64-app.zip
            dist/horizon-macos-universal-app.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sed 's/^          //' > dist/RELEASE_NOTES.md <<'EOF'
          ## Horizon macOS 独立离线版（中文说明）

          ### 1. 安装包选择
          - **`horizon-macos-arm64.dmg`**：适用于 **Apple Silicon（M1 / M2 / M3 / M4）** 芯片 Mac（推荐首选）。
          - **`horizon-macos-x64.dmg`**：适用于 **Intel（英特尔 `x86_64`）** 芯片 Mac。
          - **`horizon-macos-universal.dmg`**：双架构通用包（内含 `arm64` + `x86_64`，通吃所有 Mac）。
          - 双击 `.dmg` 后将 `Horizon.app` 拖入右侧 `Applications`（应用程序）即可。

          ### 2. 首次打开 Ad-hoc 自签名放行（必读）
          本构建采用 macOS Ad-hoc 自签名，浏览器下载后首次打开若提示「未打开 Horizon / 无法验证开发者」，请任选一种方式放行一次：
          - **系统设置放行（macOS 15+）**：双击一次弹窗点 **「完成」** → 打开 **「系统设置 → 隐私与安全性」** → 拉到底部点击 **「仍要打开 (Open Anyway)」** 并验证密码/Touch ID。
          - **右键打开（macOS 12~14）**：在「应用程序」中按住 `Control` 右键点击 `Horizon.app` → 选择 **「打开」** → 在弹窗中再点 **「打开」**。
          - **终端一键放行（最快）**：执行 `xattr -cr /Applications/Horizon.app` 后直接双击打开。

          ### 3. 导入 `horizon-26.3-resources.zip` 与离线畅玩
          - 首次打开若 `~/Downloads` 下有 `horizon-26.3-resources.zip`，直接点击 **「一键导入 Downloads/horizon-26.3-resources.zip」**（也可点击按钮选择 `.zip` 或直接把 `.zip` 拖进窗口），解压完成后自动进入离线游戏主菜单！
          - 默认免登录离线模式（`Player`），点击主菜单左上角 **`● 离线: Player [账号]`** 胶囊可随时修改自定义离线玩家名或切换微软设备码正版登录。

          ---

          ## Horizon macOS Offline Edition (English)

          ### 1. Which File to Download
          - **`horizon-macos-arm64.dmg`**: Native build for **Apple Silicon (M1 / M2 / M3 / M4)** Macs (recommended).
          - **`horizon-macos-x64.dmg`**: Native build for **Intel (`x86_64`)** Macs.
          - **`horizon-macos-universal.dmg`**: Universal fat binary (`arm64` + `x86_64`) for all Macs.
          - Open the `.dmg` and drag `Horizon.app` to `Applications`.

          ### 2. First Launch (Ad-hoc Signature / Privacy & Security → Open Anyway)
          Because this standalone build is ad-hoc signed without paid notarization, macOS Gatekeeper blocks the first launch of browser-downloaded apps. Approve it once via either method:
          - **macOS 15+ (GUI)**: Double-click `Horizon.app` once and click **Done** → open **System Settings → Privacy & Security** → scroll to Security and click **Open Anyway**.
          - **macOS 12–14 (GUI)**: Control-click (right-click) `Horizon.app` in Applications → **Open** → **Open**.
          - **Terminal (Fastest)**: Run `xattr -cr /Applications/Horizon.app`, then open normally.

          ### 3. Import `horizon-26.3-resources.zip` & Play Offline
          - On first launch, click **`Import Downloads/horizon-26.3-resources.zip`**, pick any `.zip` via the file dialog, or drag & drop the `.zip` onto the window. Once extracted, Horizon boots straight into Offline Mode (`Player`).
          - Click the top-left **`● Offline: Player [Account]`** pill on the Main Menu anytime to change your offline username or sign in with Microsoft (Device Code + macOS Keychain).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              dist/horizon-macos-*.dmg dist/horizon-macos-*-app.zip dist/SHA256SUMS.txt
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Horizon macOS Offline (${TAG})" \
              --notes-file dist/RELEASE_NOTES.md \
              dist/horizon-macos-*.dmg dist/horizon-macos-*-app.zip dist/SHA256SUMS.txt
          fi
